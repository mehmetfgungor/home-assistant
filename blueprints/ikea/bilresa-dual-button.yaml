blueprint:
  name: IKEA BILRESA dual button remote control
  author: Mehmet F Gungor
  description: >
    ## Overview
    
    This blueprint is designed for the IKEA BILRESA dual button remote control,
    a Matter-certified device communicating over Thread (Matter over Thread).
    

    ## Features
    
    **Button Controls:**
    
    - Two physical buttons (Button 1 and Button 2)
    
    - Each button supports: Single press, Double press, and Long press
    
    - Long press actions available both on press and release
    
    - Perfect for dimming, volume control, and continuous actions
    

    **Integration:**
    
    - Operates using the Matter standard protocol
    
    - Requires a Thread Border Router for communication
    
    - Exposes standardized button events for cross-ecosystem compatibility
    
    - Can control individual devices, groups, or scenes
    
    - Direct pairing: up to 10 IKEA smart products (no hub required)
    
    - Matter integration: unlimited devices via QR code pairing
    

    ## Technical Specifications
    
    - **Protocol:** Matter over Thread
    
    - **Frequency:** 2402–2480 MHz
    
    - **Range:** Up to 10 meters (open air)
    
    - **Power:** 2 × AAA (HR03) batteries
    
    - **Battery Life:** Up to 24 months (typical)
    
    - **Temperature:** 0°C to 40°C
    

    ## Design Philosophy
    
    This blueprint relies exclusively on Matter event entities, avoiding
    vendor-specific integrations to ensure maximum compatibility and
    future-proof operation within Home Assistant.
    

    📖 [Product Manual](https://www.ikea.com/gb/en/manuals/bilresa-remote-control-white-smart-dual-button__AA-2664471-2-100.pdf)
  
  domain: automation
  source_url: https://raw.githubusercontent.com/mehmetfgungor/home-assistant/refs/heads/main/blueprints/ikea/bilresa-dual-button.yaml

  input:
    remote_device:
      name: Remote Device
      description: Select your IKEA BILRESA Matter dual button remote
      selector:
        device:
          integration: matter
          entity:
            - domain: event
              device_class: button

    # ============================================
    # BUTTON 1 CONFIGURATION
    # ============================================
    button_1_state:
      name: "🔵 Button 1"
      description: Enable or disable Button 1 actions
      default: enabled
      selector:
        select:
          options:
            - label: "Enabled"
              value: enabled
            - label: "Disabled"
              value: disabled

    button_1_cooldown:
      name: "  ↳ Button 1 Cooldown"
      description: Minimum delay between Button 1 presses (prevents accidental double triggers)
      default: 0.1
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    button_1_single:
      name: "  ↳ Single Press Action"
      description: "Example: Toggle a light, play/pause media"
      default: []
      selector:
        action: {}

    button_1_double:
      name: "  ↳ Double Press Action"
      description: "Example: Activate a scene, toggle multiple lights"
      default: []
      selector:
        action: {}

    button_1_long:
      name: "  ↳ Long Press (Hold) Action"
      description: "Example: Start dimming up, increase volume"
      default: []
      selector:
        action: {}

    button_1_long_release:
      name: "  ↳ Long Press Release Action"
      description: "Example: Stop dimming, stop volume change"
      default: []
      selector:
        action: {}

    # ============================================
    # BUTTON 2 CONFIGURATION
    # ============================================
    button_2_state:
      name: "🔴 Button 2"
      description: Enable or disable Button 2 actions
      default: enabled
      selector:
        select:
          options:
            - label: "Enabled"
              value: enabled
            - label: "Disabled"
              value: disabled

    button_2_cooldown:
      name: "  ↳ Button 2 Cooldown"
      description: Minimum delay between Button 2 presses (prevents accidental double triggers)
      default: 0.1
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    button_2_single:
      name: "  ↳ Single Press Action"
      description: "Example: Toggle a light, turn off devices"
      default: []
      selector:
        action: {}

    button_2_double:
      name: "  ↳ Double Press Action"
      description: "Example: Activate night mode, lock doors"
      default: []
      selector:
        action: {}

    button_2_long:
      name: "  ↳ Long Press (Hold) Action"
      description: "Example: Start dimming down, decrease volume"
      default: []
      selector:
        action: {}

    button_2_long_release:
      name: "  ↳ Long Press Release Action"
      description: "Example: Stop dimming, stop volume change"
      default: []
      selector:
        action: {}

    # ============================================
    # ⚠️ ADVANCED SETTINGS (Optional)
    # ============================================
    # Enable the option below to configure advanced features
    # such as battery monitoring, debug mode, and action timeout.
    # Leave disabled if you don't need these features.
    # ============================================
    
    enable_advanced_settings:
      name: "🔧 Enable Advanced Settings"
      description: |
        ⚠️ Only enable this if you need advanced features.
        When enabled, additional options will appear below:
        • Battery low warning notifications
        • Debug mode for testing button presses
        • Action timeout configuration
      default: disabled
      selector:
        select:
          options:
            - label: "Disabled (Recommended)"
              value: disabled
            - label: "Enabled"
              value: enabled

    action_timeout:
      name: "  ↳ Action Timeout"
      description: "⚙️ Advanced: Maximum time to wait for an action to complete before continuing"
      default: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: seconds
          mode: slider

    battery_warning_enabled:
      name: "  ↳ 🔋 Battery Low Warning"
      description: "⚙️ Advanced: Enable to receive notifications when battery is low"
      default: disabled
      selector:
        select:
          options:
            - label: "Disabled"
              value: disabled
            - label: "Enabled"
              value: enabled

    battery_warning_level:
      name: "    ↳ Battery Warning Level"
      description: "⚙️ Advanced: Battery percentage threshold for low battery warning"
      default: 20
      selector:
        number:
          min: 5
          max: 50
          step: 5
          unit_of_measurement: "%"
          mode: slider

    battery_notification_service:
      name: "    ↳ Notification Service"
      description: "⚙️ Advanced: Service to send battery warnings (e.g., notify.mobile_app_your_phone)"
      default: ""
      selector:
        text:
          multiline: false

    debug_mode:
      name: "  ↳ 🐛 Debug Mode"
      description: "⚙️ Advanced: Enable to receive notifications for each button press (useful for testing)"
      default: disabled
      selector:
        select:
          options:
            - label: "Disabled"
              value: disabled
            - label: "Enabled"
              value: enabled

    debug_notification_service:
      name: "    ↳ Debug Notification Service"
      description: "⚙️ Advanced: Service for debug notifications (e.g., notify.mobile_app_your_phone)"
      default: ""
      selector:
        text:
          multiline: false

mode: queued
max: 10

variables:
  button_1_enabled: "{{ is_state('input_select.button_1_state', 'enabled') or button_1_state == 'enabled' }}"
  button_2_enabled: "{{ is_state('input_select.button_2_state', 'enabled') or button_2_state == 'enabled' }}"
  button_1_state: !input button_1_state
  button_2_state: !input button_2_state
  button_1_cooldown: !input button_1_cooldown
  button_2_cooldown: !input button_2_cooldown
  debug: "{{ debug_mode == 'enabled' }}"
  debug_mode: !input debug_mode
  debug_service: !input debug_notification_service
  battery_warning: "{{ battery_warning_enabled == 'enabled' }}"
  battery_warning_enabled: !input battery_warning_enabled
  battery_level: !input battery_warning_level
  battery_service: !input battery_notification_service
  timeout: !input action_timeout
  advanced_enabled: "{{ enable_advanced_settings == 'enabled' }}"
  enable_advanced_settings: !input enable_advanced_settings

trigger:
  # Button 1
  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_short_press
    subtype: button_1
    id: button_1_single

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_double_press
    subtype: button_1
    id: button_1_double

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_press
    subtype: button_1
    id: button_1_long

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_release
    subtype: button_1
    id: button_1_long_release

  # Button 2
  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_short_press
    subtype: button_2
    id: button_2_single

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_double_press
    subtype: button_2
    id: button_2_double

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_press
    subtype: button_2
    id: button_2_long

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_release
    subtype: button_2
    id: button_2_long_release

action:
  # Debug notification (only if advanced settings enabled)
  - if:
      - condition: template
        value_template: "{{ debug and debug_service != '' }}"
    then:
      - service: "{{ debug_service }}"
        data:
          title: "🔘 BILRESA Button Pressed"
          message: "Button: {{ trigger.id }} at {{ now().strftime('%H:%M:%S') }}"

  # Execute button actions with individual cooldowns
  - choose:
      # Button 1 actions
      - conditions:
          - "{{ trigger.id == 'button_1_single' }}"
          - "{{ button_1_state == 'enabled' }}"
        sequence:
          - delay:
              seconds: "{{ button_1_cooldown }}"
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_single

      - conditions:
          - "{{ trigger.id == 'button_1_double' }}"
          - "{{ button_1_state == 'enabled' }}"
        sequence:
          - delay:
              seconds: "{{ button_1_cooldown }}"
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_double

      - conditions:
          - "{{ trigger.id == 'button_1_long' }}"
          - "{{ button_1_state == 'enabled' }}"
        sequence:
          - delay:
              seconds: "{{ button_1_cooldown }}"
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_long

      - conditions:
          - "{{ trigger.id == 'button_1_long_release' }}"
          - "{{ button_1_state == 'enabled' }}"
        sequence:
          - delay:
              seconds: "{{ button_1_cooldown }}"
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_long_release

      # Button 2 actions
      - conditions:
          - "{{ trigger.id == 'button_2_single' }}"
          - "{{ button_2_state == 'enabled' }}"
        sequence:
          - delay:
              seconds: "{{ button_2_cooldown }}"
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_single

      - conditions:
          - "{{ trigger.id == 'button_2_double' }}"
          - "{{ button_2_state == 'enabled' }}"
        sequence:
          - delay:
              seconds: "{{ button_2_cooldown }}"
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_double

      - conditions:
          - "{{ trigger.id == 'button_2_long' }}"
          - "{{ button_2_state == 'enabled' }}"
        sequence:
          - delay:
              seconds: "{{ button_2_cooldown }}"
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_long

      - conditions:
          - "{{ trigger.id == 'button_2_long_release' }}"
          - "{{ button_2_state == 'enabled' }}"
        sequence:
          - delay:
              seconds: "{{ button_2_cooldown }}"
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_long_release
