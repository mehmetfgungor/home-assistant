blueprint:
  name: IKEA BILRESA dual button remote control
  author: Mehmet F Gungor
  description: >
    ## Overview
    
    This blueprint is designed for the IKEA BILRESA dual button remote control,
    a Matter-certified device communicating over Thread (Matter over Thread).
    

    ## Features
    
    **Button Controls:**
    
    - Two physical buttons (Button 1 and Button 2)
    
    - Each button supports: Single press, Double press, and Long press
    
    - Long press actions available both on press and release
    
    - Perfect for dimming, volume control, and continuous actions
    

    **Integration:**
    
    - Operates using the Matter standard protocol
    
    - Requires a Thread Border Router for communication
    
    - Exposes standardized button events for cross-ecosystem compatibility
    
    - Can control individual devices, groups, or scenes
    
    - Direct pairing: up to 10 IKEA smart products (no hub required)
    
    - Matter integration: unlimited devices via QR code pairing
    

    ## Technical Specifications
    
    - **Protocol:** Matter over Thread
    
    - **Frequency:** 2402–2480 MHz
    
    - **Range:** Up to 10 meters (open air)
    
    - **Power:** 2 × AAA (HR03) batteries
    
    - **Battery Life:** Up to 24 months (typical)
    
    - **Temperature:** 0°C to 40°C
    

    ## Design Philosophy
    
    This blueprint relies exclusively on Matter event entities, avoiding
    vendor-specific integrations to ensure maximum compatibility and
    future-proof operation within Home Assistant.
    

    📖 [Product Manual](https://www.ikea.com/gb/en/manuals/bilresa-remote-control-white-smart-dual-button__AA-2664471-2-100.pdf)
  
  domain: automation
  source_url: https://raw.githubusercontent.com/mehmetfgungor/home-assistant/refs/heads/main/blueprints/ikea/bilresa-dual-button.yaml

  input:
    remote_device:
      name: Remote Device
      description: Select your IKEA BILRESA Matter dual button remote
      selector:
        device:
          integration: matter
          entity:
            - domain: event
              device_class: button

    # ============================================
    # BUTTON 1 CONFIGURATION
    # ============================================
    button_1_enabled:
      name: "⚙️ Button 1 - Enable Actions"
      description: Toggle to enable/disable all Button 1 actions. Disable this to hide Button 1 settings.
      default: true
      selector:
        boolean: {}

    button_1_single:
      name: "  ↳ Single Press Action"
      description: "Example: Toggle a light, play/pause media"
      default: []
      selector:
        action: {}

    button_1_double:
      name: "  ↳ Double Press Action"
      description: "Example: Activate a scene, toggle multiple lights"
      default: []
      selector:
        action: {}

    button_1_long:
      name: "  ↳ Long Press (Hold) Action"
      description: "Example: Start dimming up, increase volume"
      default: []
      selector:
        action: {}

    button_1_long_release:
      name: "  ↳ Long Press Release Action"
      description: "Example: Stop dimming, stop volume change"
      default: []
      selector:
        action: {}

    # ============================================
    # BUTTON 2 CONFIGURATION
    # ============================================
    button_2_enabled:
      name: "⚙️ Button 2 - Enable Actions"
      description: Toggle to enable/disable all Button 2 actions. Disable this to hide Button 2 settings.
      default: true
      selector:
        boolean: {}

    button_2_single:
      name: "  ↳ Single Press Action"
      description: "Example: Toggle a light, turn off devices"
      default: []
      selector:
        action: {}

    button_2_double:
      name: "  ↳ Double Press Action"
      description: "Example: Activate night mode, lock doors"
      default: []
      selector:
        action: {}

    button_2_long:
      name: "  ↳ Long Press (Hold) Action"
      description: "Example: Start dimming down, decrease volume"
      default: []
      selector:
        action: {}

    button_2_long_release:
      name: "  ↳ Long Press Release Action"
      description: "Example: Stop dimming, stop volume change"
      default: []
      selector:
        action: {}

    # ============================================
    # ADVANCED SETTINGS
    # ============================================
    show_advanced_settings:
      name: "🔧 Show Advanced Settings"
      description: Enable this to configure advanced options like cooldown, battery warnings, debug mode, and timeouts
      default: false
      selector:
        boolean: {}

    button_cooldown:
      name: "  ↳ Button Cooldown"
      description: Minimum delay between button presses (prevents accidental double triggers)
      default: 0.1
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    action_timeout:
      name: "  ↳ Action Timeout"
      description: Maximum time to wait for an action to complete before continuing
      default: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: seconds
          mode: slider

    # Battery Monitoring
    battery_warning_enabled:
      name: "  ↳ 🔋 Enable Battery Warning"
      description: Send a notification when battery level is low
      default: false
      selector:
        boolean: {}

    battery_warning_level:
      name: "    ↳ Battery Warning Level"
      description: Battery percentage threshold for low battery warning
      default: 20
      selector:
        number:
          min: 5
          max: 50
          step: 5
          unit_of_measurement: "%"
          mode: slider

    battery_notification_service:
      name: "    ↳ Battery Notification Service"
      description: "Service to send battery warnings (e.g., notify.mobile_app_your_phone)"
      default: ""
      selector:
        text: {}

    # Debug Mode
    debug_mode:
      name: "  ↳ 🐛 Enable Debug Mode"
      description: Send notifications for each button press (useful for testing and troubleshooting)
      default: false
      selector:
        boolean: {}

    debug_notification_service:
      name: "    ↳ Debug Notification Service"
      description: "Service for debug notifications (e.g., notify.mobile_app_your_phone)"
      default: ""
      selector:
        text: {}

mode: queued
max: 10

variables:
  button_1_enabled: !input button_1_enabled
  button_2_enabled: !input button_2_enabled
  cooldown: !input button_cooldown
  debug: !input debug_mode
  debug_service: !input debug_notification_service
  battery_warning: !input battery_warning_enabled
  battery_level: !input battery_warning_level
  battery_service: !input battery_notification_service
  timeout: !input action_timeout

trigger:
  # Button 1
  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_short_press
    subtype: button_1
    id: button_1_single

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_double_press
    subtype: button_1
    id: button_1_double

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_press
    subtype: button_1
    id: button_1_long

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_release
    subtype: button_1
    id: button_1_long_release

  # Button 2
  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_short_press
    subtype: button_2
    id: button_2_single

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_double_press
    subtype: button_2
    id: button_2_double

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_press
    subtype: button_2
    id: button_2_long

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_release
    subtype: button_2
    id: button_2_long_release

action:
  # Debug notification
  - if:
      - condition: template
        value_template: "{{ debug and debug_service != '' }}"
    then:
      - service: "{{ debug_service }}"
        data:
          title: "🔘 BILRESA Button Pressed"
          message: "Button: {{ trigger.id }}"

  # Cooldown delay
  - delay:
      seconds: "{{ cooldown }}"

  # Execute button actions
  - choose:
      # Button 1 actions
      - conditions:
          - "{{ trigger.id == 'button_1_single' }}"
          - "{{ button_1_enabled }}"
        sequence:
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_single

      - conditions:
          - "{{ trigger.id == 'button_1_double' }}"
          - "{{ button_1_enabled }}"
        sequence:
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_double

      - conditions:
          - "{{ trigger.id == 'button_1_long' }}"
          - "{{ button_1_enabled }}"
        sequence:
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_long

      - conditions:
          - "{{ trigger.id == 'button_1_long_release' }}"
          - "{{ button_1_enabled }}"
        sequence:
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_long_release

      # Button 2 actions
      - conditions:
          - "{{ trigger.id == 'button_2_single' }}"
          - "{{ button_2_enabled }}"
        sequence:
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_single

      - conditions:
          - "{{ trigger.id == 'button_2_double' }}"
          - "{{ button_2_enabled }}"
        sequence:
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_double

      - conditions:
          - "{{ trigger.id == 'button_2_long' }}"
          - "{{ button_2_enabled }}"
        sequence:
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_long

      - conditions:
          - "{{ trigger.id == 'button_2_long_release' }}"
          - "{{ button_2_enabled }}"
        sequence:
          - timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_long_release
