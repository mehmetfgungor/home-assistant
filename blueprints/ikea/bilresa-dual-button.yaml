blueprint:
  name: "IKEA BILRESA dual button remote control"
  author: "Mehmet F Gungor"
  description: >
    ## Overview
    
    This blueprint is designed for the IKEA BILRESA dual button remote control,
    a Matter-certified device communicating over Thread (Matter over Thread).
    

    ## Features
    
    **Button Controls:**
    
    - Two physical buttons (Button 1 and Button 2)
    
    - Each button supports: Single press, Double press, and Long press
    
    - Long press actions available both on press and release
    
    - Perfect for dimming, volume control, and continuous actions
    

    **Integration:**
    
    - Operates using the Matter standard protocol
    
    - Requires a Thread Border Router for communication
    
    - Exposes standardized button events for cross-ecosystem compatibility
    
    - Can control individual devices, groups, or scenes
    
    - Direct pairing: up to 10 IKEA smart products (no hub required)
    
    - Matter integration: unlimited devices via QR code pairing
    

    ## Technical Specifications
    
    - **Protocol:** Matter over Thread
    
    - **Frequency:** 2402–2480 MHz
    
    - **Range:** Up to 10 meters (open air)
    
    - **Power:** 2 × AAA (HR03) batteries
    
    - **Battery Life:** Up to 24 months (typical)
    
    - **Temperature:** 0°C to 40°C
    

    ## Design Philosophy
    
    This blueprint relies exclusively on Matter event entities, avoiding
    vendor-specific integrations to ensure maximum compatibility and
    future-proof operation within Home Assistant.
    

    📖 [Product Manual](https://www.ikea.com/gb/en/manuals/bilresa-remote-control-white-smart-dual-button__AA-2664471-2-100.pdf)
  
  domain: automation
  source_url: https://raw.githubusercontent.com/mehmetfgungor/home-assistant/refs/heads/main/blueprints/ikea/bilresa-dual-button.yaml

  input:
    remote_device:
      name: "Remote Device"
      description: "Select your IKEA BILRESA Matter dual button remote."
      selector:
        device:
          integration: matter
          entity:
            - domain: event
              device_class: button

    # ============================================
    # BUTTON 1 CONFIGURATION
    # ============================================
    button_1_cooldown:
      name: "Button 1 - Cooldown"
      description: "Minimum delay between Button 1 presses (prevents accidental double triggers)."
      default: 0.1
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    button_1_single:
      name: "Button 1 - Single Press"
      description: "Example: Toggle a light, play/pause media"
      default: []
      selector:
        action: {}

    button_1_double:
      name: "Button 1 - Double Press"
      description: "Example: Activate a scene, toggle multiple lights"
      default: []
      selector:
        action: {}

    button_1_long:
      name: "Button 1 - Long Press (Hold)"
      description: "Example: Start dimming up, increase volume"
      default: []
      selector:
        action: {}

    button_1_long_release:
      name: "Button 1 - Long Press Release"
      description: "Example: Stop dimming, stop volume change"
      default: []
      selector:
        action: {}

    # ============================================
    # BUTTON 2 CONFIGURATION
    # ============================================
    button_2_cooldown:
      name: "Button 2 - Cooldown"
      description: "Minimum delay between Button 2 presses (prevents accidental double triggers)."
      default: 0.1
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    button_2_single:
      name: "Button 2 - Single Press"
      description: "Example: Toggle a light, turn off devices"
      default: []
      selector:
        action: {}

    button_2_double:
      name: "Button 2 - Double Press"
      description: "Example: Activate night mode, lock doors"
      default: []
      selector:
        action: {}

    button_2_long:
      name: "Button 2 - Long Press (Hold)"
      description: "Example: Start dimming down, decrease volume"
      default: []
      selector:
        action: {}

    button_2_long_release:
      name: "Button 2 - Long Press Release"
      description: "Example: Stop dimming, stop volume change"
      default: []
      selector:
        action: {}

    advanced:
      name: "Advanced Settings"
      description: |
        ---
        **Optional Configuration**
        
        Battery monitoring, debug mode, and timing configuration.
        
        *Leave these settings at default unless you need specific features.*
        ---
      collapsed: true
      input:
        action_timeout:
          name: "Action Timeout"
          description: "Maximum time (in seconds) to wait for an action to complete before continuing."
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: seconds
              mode: slider

        battery_warning_enabled:
          name: "Enable Battery Low Warning"
          description: "Receive notifications when the remote's battery level is low."
          default: disabled
          selector:
            select:
              options:
                - label: "Disabled"
                  value: disabled
                - label: "Enabled"
                  value: enabled

        battery_warning_level:
          name: "Battery Warning Threshold"
          description: "Battery percentage level that triggers low battery notifications."
          default: 20
          selector:
            number:
              min: 5
              max: 50
              step: 5
              unit_of_measurement: "%"
              mode: slider

        battery_notification_service:
          name: "Battery Notification Service"
          description: "Home Assistant notification service for battery warnings (e.g., notify.mobile_app_your_phone)."
          default: ""
          selector:
            text:
              multiline: false

        debug_mode:
          name: "Enable Debug Mode"
          description: "Receive real-time notifications for each button press event (useful for testing and troubleshooting)."
          default: disabled
          selector:
            select:
              options:
                - label: "Disabled"
                  value: disabled
                - label: "Enabled"
                  value: enabled

        debug_notification_service:
          name: "Debug Notification Service"
          description: "Home Assistant notification service for debug messages (e.g., notify.mobile_app_your_phone)."
          default: ""
          selector:
            text:
              multiline: false

mode: queued
max: 10

variables:
  button_1_cooldown: !input button_1_cooldown
  button_2_cooldown: !input button_2_cooldown
  debug: "{{ debug_mode == 'enabled' }}"
  debug_mode: !input debug_mode
  debug_service: !input debug_notification_service
  battery_warning: "{{ battery_warning_enabled == 'enabled' }}"
  battery_warning_enabled: !input battery_warning_enabled
  battery_level: !input battery_warning_level
  battery_service: !input battery_notification_service
  timeout: !input action_timeout

trigger:
  # Button 1
  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_short_press
    subtype: button_1
    id: button_1_single

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_double_press
    subtype: button_1
    id: button_1_double

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_press
    subtype: button_1
    id: button_1_long

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_release
    subtype: button_1
    id: button_1_long_release

  # Button 2
  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_short_press
    subtype: button_2
    id: button_2_single

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_double_press
    subtype: button_2
    id: button_2_double

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_press
    subtype: button_2
    id: button_2_long

  - platform: device
    domain: matter
    device_id: !input remote_device
    type: button_long_release
    subtype: button_2
    id: button_2_long_release

action:
  # Debug notification (only if advanced settings enabled)
  - if:
      - condition: template
        value_template: "{{ debug and debug_service != '' }}"
    then:
      - service: "{{ debug_service }}"
        data:
          title: "🔘 BILRESA Button Pressed"
          message: "Button: {{ trigger.id }} at {{ now().strftime('%H:%M:%S') }}"

  # Execute button actions with individual cooldowns
  - choose:
      # Button 1 actions
      - conditions:
          - "{{ trigger.id == 'button_1_single' }}"
        sequence:
          - delay:
              seconds: "{{ button_1_cooldown }}"
          - alias: "Execute Button 1 Single Press"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_single

      - conditions:
          - "{{ trigger.id == 'button_1_double' }}"
        sequence:
          - delay:
              seconds: "{{ button_1_cooldown }}"
          - alias: "Execute Button 1 Double Press"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_double

      - conditions:
          - "{{ trigger.id == 'button_1_long' }}"
        sequence:
          - delay:
              seconds: "{{ button_1_cooldown }}"
          - alias: "Execute Button 1 Long Press"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_long

      - conditions:
          - "{{ trigger.id == 'button_1_long_release' }}"
        sequence:
          - delay:
              seconds: "{{ button_1_cooldown }}"
          - alias: "Execute Button 1 Long Release"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_1_long_release

      # Button 2 actions
      - conditions:
          - "{{ trigger.id == 'button_2_single' }}"
        sequence:
          - delay:
              seconds: "{{ button_2_cooldown }}"
          - alias: "Execute Button 2 Single Press"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_single

      - conditions:
          - "{{ trigger.id == 'button_2_double' }}"
        sequence:
          - delay:
              seconds: "{{ button_2_cooldown }}"
          - alias: "Execute Button 2 Double Press"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_double

      - conditions:
          - "{{ trigger.id == 'button_2_long' }}"
        sequence:
          - delay:
              seconds: "{{ button_2_cooldown }}"
          - alias: "Execute Button 2 Long Press"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_long

      - conditions:
          - "{{ trigger.id == 'button_2_long_release' }}"
        sequence:
          - delay:
              seconds: "{{ button_2_cooldown }}"
          - alias: "Execute Button 2 Long Release"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
            sequence: !input button_2_long_release
